# Headless service that gives each etcd pod a stable DNS name of the form
# etcd-<ordinal>.etcd.ate-system.svc, used for both peer and client traffic.
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: ate-system
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: etcd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  - name: peer
    port: 2380
    targetPort: 2380
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: ate-system
spec:
  serviceName: etcd
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: gcr.io/etcd-development/etcd:v3.6.8
        ports:
        - name: client
          containerPort: 2379
        - name: peer
          containerPort: 2380
        # etcd is configured entirely through ETCD_* environment variables so
        # that we do not depend on a shell being present in the image. Kubernetes
        # expands $(POD_NAME) in later env values from the earlier fieldRef.
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ETCD_NAME
          value: $(POD_NAME)
        - name: ETCD_DATA_DIR
          value: /data
        - name: ETCD_INITIAL_CLUSTER_TOKEN
          value: ate-etcd
        - name: ETCD_INITIAL_CLUSTER_STATE
          value: new
        - name: ETCD_INITIAL_CLUSTER
          value: "etcd-0=https://etcd-0.etcd.ate-system.svc:2380,etcd-1=https://etcd-1.etcd.ate-system.svc:2380,etcd-2=https://etcd-2.etcd.ate-system.svc:2380"
        - name: ETCD_LISTEN_PEER_URLS
          value: https://0.0.0.0:2380
        - name: ETCD_LISTEN_CLIENT_URLS
          value: https://0.0.0.0:2379
        - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
          value: https://$(POD_NAME).etcd.ate-system.svc:2380
        - name: ETCD_ADVERTISE_CLIENT_URLS
          value: https://$(POD_NAME).etcd.ate-system.svc:2379
        # Client TLS, with mutual auth: clients must present a certificate
        # signed by the trusted CA.
        - name: ETCD_CERT_FILE
          value: /run/servicedns.podcert.ate.dev/credential-bundle.pem
        - name: ETCD_KEY_FILE
          value: /run/servicedns.podcert.ate.dev/credential-bundle.pem
        - name: ETCD_TRUSTED_CA_FILE
          value: /etc/etcd-ca/ca.crt
        - name: ETCD_CLIENT_CERT_AUTH
          value: "true"
        # Peer TLS, with mutual auth between cluster members.
        - name: ETCD_PEER_CERT_FILE
          value: /run/servicedns.podcert.ate.dev/credential-bundle.pem
        - name: ETCD_PEER_KEY_FILE
          value: /run/servicedns.podcert.ate.dev/credential-bundle.pem
        - name: ETCD_PEER_TRUSTED_CA_FILE
          value: /etc/etcd-ca/ca.crt
        - name: ETCD_PEER_CLIENT_CERT_AUTH
          value: "true"
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
        - name: etcd-ca-certs
          mountPath: /etc/etcd-ca
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: etcd-ca-certs
        projected:
          sources:
          - secret:
              name: etcd-ca-certs
              items:
              - key: ca.crt
                path: ca.crt
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
